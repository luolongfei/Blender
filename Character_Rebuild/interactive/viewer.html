<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>角色 · 动作预览</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
  <header class="page-header">
    <div class="identity"><span class="brand-mark" aria-hidden="true">◌</span><div><p class="eyebrow">CHARACTER STUDIO</p><h1>角色动作预览</h1></div></div>
    <nav aria-label="相关文件"><a href="../review.html">修复前后对比 <span aria-hidden="true">↗</span></a><a id="download" class="download-link" hidden download="animated-preview.glb">下载动作模型</a><a id="download-blend" class="download-link" hidden download="rigged-preview.blend">下载可编辑工程</a></nav>
  </header>
  <main class="workspace">
    <section class="stage" aria-label="角色三维预览">
      <div id="viewport" data-ready="false" data-playing="false">
        <div class="stage-top"><span class="local-badge"><i aria-hidden="true"></i> 本机交互预览</span><span id="status" role="status" aria-live="polite">正在准备</span></div>
        <div id="overlay" role="status" aria-live="polite"><div class="loading-card"><div id="loading-symbol" class="loading-symbol" aria-hidden="true">◌</div><h2 id="loading-title">正在载入角色</h2><p id="loading-detail">准备模型、贴图和动作。</p><progress id="progress" max="1"></progress><button id="retry" class="primary" hidden>重新载入</button></div></div>
        <div class="stage-bottom"><p>拖动旋转 <span>·</span> 滚轮缩放 <span>·</span> 右键平移</p><button id="reset-camera" class="quiet-button" disabled title="恢复默认观察角度">重置视角 <span aria-hidden="true">↺</span></button></div>
      </div>
      <div class="transport" aria-label="动作播放控制">
        <button id="play-pause" class="play-button" disabled aria-label="暂停动作"><svg id="pause-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg><svg id="play-symbol" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m9 5 11 7-11 7Z"/></svg></button>
        <div class="timeline-area"><div class="timeline-heading"><strong id="active-motion">等待载入</strong><output id="time-label" for="timeline">0:00 / 0:00</output></div><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="动作时间" disabled></div>
        <button id="reset-idle" class="secondary" disabled>恢复站立</button>
      </div>
    </section>
    <aside class="controls" aria-label="角色控制">
      <section class="control-section"><div class="section-heading"><h2>动作</h2><span class="section-note">选择即可播放</span></div><div id="actions" class="action-grid"></div><p id="action-note" class="small-note">动作准备好后会显示在这里。</p></section>
      <section class="control-section"><div class="section-heading"><label for="speed">播放速度</label><output id="speed-value" for="speed">1.0×</output></div><input id="speed" type="range" min="0.25" max="1.5" value="1" step="0.05" disabled><div class="range-labels" aria-hidden="true"><span>慢</span><span>正常</span><span>快</span></div></section>
      <section class="control-section"><div class="section-heading"><h2>观察角色</h2></div><div class="segmented"><button data-crop="body" aria-pressed="true" disabled>全身</button><button data-crop="head" aria-pressed="false" disabled>头肩</button></div><div class="view-grid"><button data-view="front" aria-pressed="true" disabled>正面</button><button data-view="oblique" aria-pressed="false" disabled>斜前</button><button data-view="side" aria-pressed="false" disabled>侧面</button><button data-view="back" aria-pressed="false" disabled>背面</button></div></section>
      <section class="control-section pose-section"><div class="section-heading"><h2>初始姿势</h2></div><button id="tpose" class="wide secondary" disabled>查看 T 形姿势</button><p class="small-note">恢复模型最初的双臂平展姿势，方便查看整体结构。</p></section>
      <section class="preview-note"><span class="note-dot" aria-hidden="true"></span><div><strong>基础动作预览</strong><p id="scope-note">保留本次重建角色，加入基础身体动作。暂未制作表情、头发和裙子的物理模拟。</p><p class="touch-note">触屏：单指旋转，双指缩放或平移。</p></div></section>
    </aside>
  </main>
  <footer><span>角色重建 · 动作观察</span><span id="footer-status">模型载入后可直接操作</span></footer>
  <output id="runtime-state" hidden aria-hidden="true"></output>
  <script type="module" src="./viewer.mjs"></script>
</body>
</html>
